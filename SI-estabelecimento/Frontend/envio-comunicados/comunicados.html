<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicados (Telegram) - Agenda Smart</title>
  <link rel="icon" type="image/png" href="../Logo/logotipo.png">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="comunicados.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo-container">
        <img src="../Logo/logotipo.png" alt="Agenda Smart Logo" class="logo-img">
      </div>
      <div class="status-connection-card" id="connection-card">
        <div class="connection-header">
          <span class="status-dot" id="status-dot"></span>
          <strong id="connection-title">Verificando conexão...</strong>
        </div>
        <p class="phone-number" id="numero-status-phone">Telegram Bot API</p>
        <span class="metrics-text" id="connection-subtext">Carregando status do bot</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
      </header>

      <div class="dashboard-grid">
        <!-- Comunicados rápidos -->
        <section class="config-card full-width">
          <div class="card-header">
            <h3 class="title-sm">Envio de Comunicados Rápidos</h3>
          </div>
          <p class="card-desc">Escreva um aviso geral — feriados, folgas, promoções ou recados — e dispare a mensagem para os clientes pelo Telegram.</p>
          <div class="form-group">
            <label for="textarea-announcement">Texto do Comunicado:</label>
            <textarea id="textarea-announcement" rows="6" placeholder="Ex: Informamos que estaremos abertos neste feriado, das 9h às 14h."></textarea>
          </div>
          <button id="btn-send-broadcast" class="btn-primary btn-block">Enviar Comunicado</button>
        </section>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Navegação principal">

    <a href="../Clientes/Cliente.html"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Clientes</a>
    <a href="../Dashboard/Dash.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a>
    <a href="../Fila-de-espera/Fila.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Fila de espera</a>
    <a href="../Minha-Agenda/minhaAgenda.html"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Minha Agenda</a>
    <a href="comunicados.html" class="active"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.3L3 21l2.2-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>Comunicados</a>
  </nav>

  <script src="comunicados.js"></script>
</body>
</html>
